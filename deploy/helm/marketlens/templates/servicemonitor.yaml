{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "marketlens.fullname" . }}-api
  labels:
    {{- include "marketlens.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "marketlens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: http
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.serviceMonitor.bearerTokenSecret.name }}
          key: {{ .Values.serviceMonitor.bearerTokenSecret.key }}
{{- end }}
