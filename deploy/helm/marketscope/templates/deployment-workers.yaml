{{- $root := . -}}
{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketscope.fullname" $root }}-{{ $name }}
  labels:
    {{- include "marketscope.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-worker
spec:
  replicas: {{ $worker.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "marketscope.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}-worker
  template:
    metadata:
      labels:
        {{- include "marketscope.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}-worker
      annotations:
        checksum/values: {{ toYaml $root.Values.env | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "marketscope.serviceAccountName" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "marketscope.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "marketscope.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command:
            {{- toYaml $worker.command | nindent 12 }}
          securityContext:
            {{- include "marketscope.securityContext" $root | nindent 12 }}
          env:
            {{- include "marketscope.env" $root | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.existingSecret }}
            {{- with $root.Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
