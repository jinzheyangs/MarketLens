name: real-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 0"

permissions:
  contents: read

jobs:
  real-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Start PostgreSQL
        run: |
          docker run -d --name ml-postgres \
            -e POSTGRES_USER=marketscope \
            -e POSTGRES_PASSWORD=test-only \
            -e POSTGRES_DB=marketscope_test \
            -p 127.0.0.1:55432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ml-postgres pg_isready -U marketscope -d marketscope_test && break
            sleep 2
          done

      - name: Start Qdrant
        run: |
          docker run -d --name ml-qdrant -p 127.0.0.1:6333:6333 qdrant/qdrant:v1.12.5
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6333/readyz && break
            sleep 2
          done

      - name: Start S3 API
        run: |
          docker run -d --name ml-s3 -p 127.0.0.1:9090:9090 adobe/s3mock:latest
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9090/ >/dev/null && break
            sleep 2
          done

      - name: Start Redpanda
        run: |
          docker run -d --name ml-redpanda -p 127.0.0.1:9092:9092 \
            redpandadata/redpanda:v24.2.7 \
            redpanda start --overprovisioned --smp 1 --memory 1G \
            --reserve-memory 0M --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092
          sleep 15

      - name: Start Temporal dev server
        run: |
          curl -sSL -o temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.1.0/temporal_cli_1.1.0_linux_amd64.tar.gz
          tar xzf temporal.tar.gz
          nohup ./temporal server start-dev --ip 127.0.0.1 --port 7233 --http-port 8234 --headless \
            >/tmp/temporal.log 2>&1 &
          sleep 5
          for i in $(seq 1 30); do
            ./temporal operator namespace list --address 127.0.0.1:7233 && break
            sleep 2
          done

      - name: Migrate
        env:
          DATABASE_URL: postgresql+asyncpg://marketscope:test-only@127.0.0.1:55432/marketscope_test
        run: alembic upgrade head

      - name: Real service tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://marketscope:test-only@127.0.0.1:55432/marketscope_test
          QDRANT_TEST_URL: http://127.0.0.1:6333
          S3_TEST_ENDPOINT_URL: http://127.0.0.1:9090
          S3_TEST_ACCESS_KEY: test-key
          S3_TEST_SECRET_KEY: test-secret
          KAFKA_TEST_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          TEMPORAL_TEST_ADDRESS: 127.0.0.1:7233
        run: pytest -m real tests/integration/real -q
