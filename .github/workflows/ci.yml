name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market_intel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: market_intel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_intel -d market_intel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://market_intel:ci-only-password@127.0.0.1:5432/market_intel_test
      TEST_DATABASE_URL: postgresql+asyncpg://market_intel:ci-only-password@127.0.0.1:5432/market_intel_test
      QDRANT_URL: ""
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: CLI smoke
        run: |
          python -m app.cli --help
          python -m app.collector.worker --help
          python -m app.agent.worker --help
          python -m app.events.worker --help
          python -m app.monitoring.worker --help
          python -m app.ops.retention --help

      - name: Migration upgrade / downgrade / upgrade / drift check
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  deploy-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: pip install pyyaml

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/marketlens
          helm template marketlens deploy/helm/marketlens \
            --set api.ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set externalSecrets.enabled=true > /tmp/marketlens-rendered.yaml
          python - <<'PY'
          import yaml
          with open('/tmp/marketlens-rendered.yaml', encoding='utf-8') as handle:
              documents = [doc for doc in yaml.safe_load_all(handle) if doc]
          assert len(documents) >= 10, len(documents)
          kinds = {doc['kind'] for doc in documents}
          for required in ('Deployment', 'NetworkPolicy', 'PodDisruptionBudget',
                           'HorizontalPodAutoscaler', 'Job', 'ServiceMonitor'):
              assert required in kinds, required
          PY

      - name: Terraform format and validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate observability assets
        run: |
          python - <<'PY'
          import json
          import yaml
          with open('deploy/observability/prometheus-rules.yaml', encoding='utf-8') as handle:
              rules = yaml.safe_load(handle)
          assert rules['groups'], 'at least one rule group is required'
          with open('deploy/observability/grafana-dashboard.json', encoding='utf-8') as handle:
              dashboard = json.load(handle)
          assert dashboard['panels'], 'dashboard must contain panels'
          with open('deploy/observability/otel-collector.yaml', encoding='utf-8') as handle:
              assert yaml.safe_load(handle)['service']['pipelines']
          PY
          bash -n deploy/scripts/backup-postgres.sh
          bash -n deploy/scripts/restore-postgres.sh
          bash -n deploy/scripts/verify-backup.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t market-intel-backend:ci .
