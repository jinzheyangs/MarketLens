name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market_intel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: market_intel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_intel -d market_intel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://market_intel:ci-only-password@127.0.0.1:5432/market_intel_test
      TEST_DATABASE_URL: postgresql+asyncpg://market_intel:ci-only-password@127.0.0.1:5432/market_intel_test
      QDRANT_URL: ""
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: CLI smoke
        run: |
          python -m app.cli --help
          python -m app.collector.worker --help

      - name: Migration upgrade / downgrade / upgrade / drift check
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t market-intel-backend:ci .
