name: marketscope

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketscope}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-marketscope_test}
    ports:
      # Bind to loopback only; do not expose the database to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Local S3-compatible development storage. Some networks require an image
  # registry mirror or login for official MinIO images; the application also
  # supports OBJECT_STORAGE_BACKEND=local as a fallback.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketscope_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  migrate:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Container-internal service address overrides the host-oriented .env value.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Container-internal service addresses override host-oriented .env values.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketscope_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-marketscope-documents}
      S3_USE_SSL: "false"
      S3_ADDRESSING_STYLE: path
      S3_AUTO_CREATE_BUCKET: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Used only when OBJECT_STORAGE_BACKEND=local (development fallback).
      - rag_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=2); c.request('GET','/health/live'); raise SystemExit(0 if c.getresponse().status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  collector:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # The worker renders/collects external content; it has no inbound port.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketscope_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-marketscope-documents}
      S3_USE_SSL: "false"
      S3_ADDRESSING_STYLE: path
      S3_AUTO_CREATE_BUCKET: "true"
    command: ["python", "-m", "app.collector.worker"]
    volumes:
      - rag_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9092:9092"
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:1.25.2
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    restart: unless-stopped

  agent:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # The research worker has no inbound port. Model calls are outbound to the
      # operator-configured gateway only; there is no arbitrary agent egress.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketscope_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-marketscope-documents}
      S3_USE_SSL: "false"
      S3_ADDRESSING_STYLE: path
      S3_AUTO_CREATE_BUCKET: "true"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_TLS: "false"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["python", "-m", "app.agent.worker"]
    volumes:
      - rag_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_started
      redpanda:
        condition: service_started
    restart: unless-stopped

  events:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Outbox dispatcher and Kafka consumer; no inbound port.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["python", "-m", "app.events.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    restart: unless-stopped

  monitor:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Scheduler, change detector, and notification dispatcher; no inbound port.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      MONITORING_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketscope_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-marketscope-documents}
      S3_USE_SSL: "false"
      S3_ADDRESSING_STYLE: path
      S3_AUTO_CREATE_BUCKET: "true"
    command: ["python", "-m", "app.monitoring.worker"]
    volumes:
      - rag_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  ops-metrics:
    image: marketscope-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketscope}
      OPS_METRICS_PORT: "9101"
    command: ["python", "-m", "app.ops.metrics_exporter"]
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  rag_data:
