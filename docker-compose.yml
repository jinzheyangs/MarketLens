name: market-intel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-market_intel}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-market_intel_test}
    ports:
      # Bind to loopback only; do not expose the database to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  migrate:
    image: market-intel-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Container-internal service address overrides the host-oriented .env value.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-market_intel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-market_intel}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: market-intel-api:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Container-internal service address overrides the host-oriented .env value.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-market_intel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-market_intel}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=2); c.request('GET','/health/live'); raise SystemExit(0 if c.getresponse().status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
